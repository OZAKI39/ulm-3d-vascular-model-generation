[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevo-mb"
version = "0.1.0"
description = "Linear ultrasound basis fields and dilute microbubble transport research demo"
requires-python = ">=3.11"
dependencies = ["k-wave-python>=0.6", "numpy", "scipy", "h5py", "PyYAML", "pyvista", "matplotlib", "pandas", "tqdm", "psutil"]

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
dev = ["pytest", "ruff"]
visualization = ["imageio", "imageio-ffmpeg", "Pillow"]
warp-wall = ["warp-lang==1.17.0", "cupy-cuda13x"]
motion-qp = ["osqp==1.1.3"]

[project.scripts]
mevo-mb = "mevo_mb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not deprecated_reference'"
markers = ["deprecated_reference: archived Zhang literature evidence, excluded from production CI", "gpu: requires NVIDIA GPU and CUDA", "acoustic: executes a small acoustic solver", "apecss: requires compiled APECSS", "literature: executes a published reference case", "slow: computational validation"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
