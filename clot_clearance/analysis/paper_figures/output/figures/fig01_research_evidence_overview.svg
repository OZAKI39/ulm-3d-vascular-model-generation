   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(27.450709 277.370335)">Validate finite-domain loading and force support.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(27.450709 290.570335)">Define a physically interpretable failure observable.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(282.339213 277.370335)">Then test clot-specific calibration and coupling.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(282.339213 290.570335)">Current coupon evidence is not a rupture prediction.</text>
   </g>
