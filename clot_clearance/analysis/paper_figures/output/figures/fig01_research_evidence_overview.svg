   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(282.339213 97.299469)">Sampling changes the apparent fraction.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(282.339213 110.499469)">Mesh objectivity is not established.</text>
