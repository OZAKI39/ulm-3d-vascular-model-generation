[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-feasibility-validation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "PyYAML", "vtk", "pyvista", "matplotlib", "pytest", "Pillow"]

[tool.setuptools.packages.find]
where = ["mesh_generate/src", "solver_support/src"]

[tool.pytest.ini_options]
pythonpath = ["mesh_generate/src", "solver_support/src"]
testpaths = ["tests"]
