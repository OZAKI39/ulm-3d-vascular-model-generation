schema_version: 1
method: PROTEUS_COMPATIBLE_SEEDER_MUSUBI_STEADY_LBM_BASELINE

paths:
  source_surface_run: outputs/cfd_surface_prepare/vmtk_tps_boundarynormal_crossseam_finalized_recovery_anchor003274_20260826_221611
  output_root: outputs/cfd_flow

apes:
  execution_environment: WSL2
  wsl_distribution: Ubuntu
  seeder_repository: https://github.com/apes-suite/seeder
  seeder_commit: 667109df6fafdcb39f4409e3f5d90f04d75cd33c
  musubi_repository: https://github.com/apes-suite/musubi
  musubi_commit: 4e8b277b66226277171ef93bf054d21270812793
  proteus_repository: https://github.com/PROTEUS-SIM/PROTEUS
  proteus_reference_commit: fc24fcbcf9623006e8f79989c0126c45a76bc23b
  seeder_executable: auto
  musubi_executable: auto
  harvesting_executable: auto
  mpi_launcher: auto
  mpi_ranks: auto

mesh:
  dx_target_um: 0.20
  bounding_margin_cells: 4
  uniform_cartesian: true
  automatic_resolution_sweep: false

physics:
  reference_dx_m: 1.28e-7
  reference_dt_s: 1.0e-8
  lattice_cs_squared: 0.3333333333333333

solver:
  kind: fluid
  layout: d3q19
  relaxation: bgk
  wall_boundary: wall_libb
  inlet_boundary: mfr_eq
  outlet_boundary: pressure_eq
  maximum_iterations: 1000000
  wallclock_limit_s: 3600
  convergence_interval_iterations: 100
  convergence_nvals: 100
  velocity_absolute_threshold_m_s: 1.0e-9
  pressure_absolute_threshold_pa: 1.0e-3
  maximum_lattice_mach: 0.05

resources:
  maximum_available_ram_fraction: 0.60
  estimated_bytes_per_fluid_cell: 1600

qc:
  maximum_mass_conservation_error: 0.01
  maximum_inlet_flow_relative_error: 0.01
  fluid_inside_tolerance_cells: 1.0
