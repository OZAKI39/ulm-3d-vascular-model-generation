schema_version: 1

# Relative paths are resolved from the ulm_3D_vascular project directory.
paths:
  sampling_run: outputs/sampling/20260825_133201_radius_plus_structure_k5
  output_root: outputs/reference_validation/roi003274_ultraliser_radius091/reconstructions
  ultraliser_executable: null

# Exactly one selector must be non-null.
selection:
  roi_anchor: 3274
  roi_id: null

reconstruction:
  surface_backend: ultraliser
  run_id: baseline_radius100

ultraliser:
  enabled: true
  ultraliser_root: Ultraliser
  radius_scale: 1.0
  voxels_per_micron: 6.0
  packing_algorithm: polylines-with-spheres
  voxelization_axis: xyz
  isosurface_technique: dmc
  solid_voxelization: true
  adaptive_optimization: true
  optimization_iterations: 5
  smooth_iterations: 5
  laplacian_iterations: 10
  threads: 8
  export_stl: true

surface_qc:
  radius_fidelity_samples_per_branch: 10
  radius_fidelity_skip_diameters: 2.0
  max_radius_p95_error: 0.05
  require_watertight: true
  require_single_component: true
  require_zero_boundary_edges: true
  require_zero_nonmanifold_edges: true
  require_zero_self_intersections: true
  require_zero_degenerate_triangles: true
