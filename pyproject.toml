[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-vessel-flow"
version = "0.1.0"
description = "Independent mouse cerebral vessel CFD and frozen-field microbubble workflow"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "vtk>=9.3", "pyvista>=0.43", "PyYAML>=6", "networkx>=3", "pandas>=2", "h5py>=3", "tifffile", "scikit-image", "trimesh", "matplotlib>=3.8", "Pillow>=10", "nibabel", "shapely", "pymeshfix", "imageio-ffmpeg"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mouse-flow = "mouse_vessel_flow.main:main"

[tool.setuptools.packages.find]
include = ["mouse_vessel_flow*"]

[tool.setuptools.package-data]
"mouse_vessel_flow.particles" = ["*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
