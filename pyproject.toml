[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clot-simulation"
version = "0.1.0"
description = "Irregular Y-clot variational LPS, explicit native dynamics and current-surface loading"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "vtk==9.6.2", "pyvista==0.49.0", "mpi4py==4.1.2", "PyYAML==6.0.3", "matplotlib>=3.10", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clot-sim = "clot_sim.main:main"

[tool.setuptools]
packages = ["clot_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
