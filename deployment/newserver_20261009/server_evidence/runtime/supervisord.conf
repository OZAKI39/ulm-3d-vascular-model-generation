[unix_http_server]
file=/workspace/brava_cfd/runtime/supervisor.sock
chmod=0700
[supervisord]
logfile=/workspace/brava_cfd/logs/supervisord.log
pidfile=/workspace/brava_cfd/runtime/supervisord.pid
childlogdir=/workspace/brava_cfd/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///workspace/brava_cfd/runtime/supervisor.sock
[program:environment]
command=/usr/bin/python3 /workspace/brava_cfd/runtime/setup_environment.py
directory=/workspace/brava_cfd
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/brava_cfd/logs/environment_supervised.log
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:native_build]
command=/usr/bin/python3 /workspace/brava_cfd/runtime/build_native.py
directory=/workspace/brava_cfd
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/brava_cfd/logs/native_build_supervised.log
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:validation]
command=/workspace/brava_cfd/bin/brava-env python /workspace/brava_cfd/runtime/validate_environment.py
directory=/workspace/brava_cfd
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/brava_cfd/logs/validation_supervised.log
stdout_logfile_maxbytes=0
redirect_stderr=true
