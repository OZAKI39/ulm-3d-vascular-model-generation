schema_version: 1
input:
  alignment_root: outputs/topbrain_brava_transfer/nn_production/BG001/RMCA/compact_manufacturing_roi/print_fixture_design_all_ports_aligned
  summary: all_port_attachment_summary.json
  report: all_port_attachment_report.md
  old_box_qc: ../print_fixture_design_aligned/geometry_qc.json
output:
  directory: final_abs_casting_mold
  basename: BG001_RMCA_BALANCED
box:
  policy: BOX_DIMENSIONS_REUSED
  minimum_overlap_fraction: 0.90
pdms:
  junction_exemption_mm: 5.0
  o3_minimum_mm: 1.6
  o3_maximum_deviation_mm: 0.10
  wall_crossing_exemption_mm: 2.0
support_removal_probe:
  diameter_mm: 3.0
  surface_standoff_mm: 0.25
  capsule_sections: 16
support:
  region_length_mm: 6.0
  sample_faces_per_region: 18
  cone_angles_deg: [0, 15, 30]
  cone_azimuth_step_deg: 45
  minimum_risk_region_area_mm2: 0.05
  heuristic_threshold_from_horizontal_deg: 30.0
orientation:
  yaw_angles_deg: [0, 45, 90, 135]
  tilt_degrees: [-5, 5, -15, 15]
  bed_contact_band_mm: 0.20
  minimum_bed_contact_area_mm2: 20.0
  minimum_support_polygon_margin_mm: 1.0
  bed_margin_mm: 10.0
  top_margin_mm: 5.0
  top_count: 5
  baseline_search_trigger_area_mm2: 1.0
printer:
  filament: ABS
  provisional_build_volume_mm: [256.0, 256.0, 250.0]
bambu:
  help_timeout_seconds: 20
  timeout_seconds: 300
  bed_type: Textured PEI Plate
  support_on_overhang_area_mm2: 0.01
feature_qc:
  spatial_bin_mm: 3.0
  toolpath_sample_step_mm: 0.35
  maximum_surface_distance_mm: 0.60
  minimum_bin_coverage_fraction: 0.90
geometry:
  mesh_tolerance_mm: 0.02
  mesh_angular_tolerance_rad: 0.10
  centerline_label_sample_step_mm: 0.20
  volume_tolerance_mm3: 0.001
  coordinate_tolerance_mm: 0.0001
  minimum_triangle_area_mm2: 0.0000000001
  boolean_cleanup_tolerance_mm: 0.00001
visualization:
  chinese_font: /mnt/c/Windows/Fonts/msyh.ttc
  window_size: [1400, 1000]
