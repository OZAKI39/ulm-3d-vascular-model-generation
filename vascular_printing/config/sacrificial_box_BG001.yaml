schema_version: 1
input:
  compact_root: outputs/topbrain_brava_transfer/nn_production/BG001/RMCA/compact_manufacturing_roi
  candidate: BALANCED
  source_stl: BG001_RMCA_BALANCED_print_candidate.stl
  manifest: compact_manifest.json
  transform: print_transform.json
  compact_swc: candidates/BALANCED/compensated.swc
  fitted_swc: candidates/BALANCED/VascularMD/compensated_vmd_smooth.swc
  node_mapping: candidates/BALANCED/compensated_mapping.csv
  edge_mapping: candidates/BALANCED/compensated_edges.csv
output:
  directory: print_fixture_design_aligned
  previous_directory: print_fixture_design_adaptive
  basename: BG001_RMCA_BALANCED
box:
  margin_x_mm: 12.0
  margin_y_mm: 12.0
  margin_bottom_mm: 10.0
  margin_top_mm: 12.0
  wall_thickness_mm: 3.0
  bottom_thickness_mm: 3.0
  open_top: true
ports:
  outside_stub_mm: 10.0
  min_wall_edge_clearance_mm: 8.0
  min_port_spacing_mm: 8.0
  route_clearance_mm: 3.0
  assembly_clearance_mm: 0.20  # RADIAL: hole radius = port radius + clearance
  preferred_max_turn_angle_deg: 45.0
  minimum_bend_radius_mm: 6.0
attachment_alignment:
  endpoint_ids: ['I1', 'O1', 'O2', 'O3']
  cap_match_tolerance_mm: 0.0001
  straight_lead_mm: 0.25
  collar_length_mm: 0.20
  collar_length_fallback_mm: [0.20, 0.15, 0.10]
  collar_inner_radius_fraction: 0.65
  collar_outside_volume_tolerance_mm3: 0.000001
  section_offset_mm: 0.02
  section_match_tolerance_mm: 0.0001
native_restoration:
  source_swc: vessel_model/T - Brava/swc_files/BG001.CNG.swc
  # Only true outward successors may be restored, never nearby sibling vessels.
  require_original_topology_audit_before_relaxation: true
clearance_fallback:
  enabled: true
  # Last resort only after strict routing and the original-data restoration audit.
  authorization: 用户要求禁止 Z 端口，优先自适应补回原始血管，万不得已才放宽 3 mm 间距。
  decrement_mm: 0.1
  minimum_mm: 0.0
  # Other ports, wall edges, bend radii and nonintersection remain constrained.
  retain_port_to_port_clearance: true
routing:
  allowed_faces: ['-X', '+X', '-Y', '+Y']
  prefer_opposite_faces: true
  max_outlet_faces: 2
  tangent_window_mm: 5.0
  tangent_resample_step_mm: 0.25
  attachment_overlap_mm: 0.6
  attachment_exemption_mm: 5.0
  wall_approach_mm: 3.0
  target_lateral_offsets_mm: [0, -10, 10]
  target_vertical_offsets_mm: [0, 8, -8]
  spline_tangent_scales: [0.7, 1.0, 1.5, 2.0]
  natural_bend_radii_mm: [6.2, 8.0, 10.0, 12.0]
  natural_bend_interpolation_points: 17
  curvature_step_mm: 0.25
  bend_radius_safety_factor: 1.02
  options_per_face: 8
  preferred_max_curved_turn_angle_deg: 120.0
  score_weights:
    normalized_distance: 0.35
    normalized_turn_angle: 0.35
    collision_penalty: 0.20
    wall_edge_penalty: 0.10
geometry:
  mesh_tolerance_mm: 0.02
  mesh_angular_tolerance_rad: 0.10
  centerline_label_sample_step_mm: 0.20
  volume_tolerance_mm3: 0.001
  coordinate_tolerance_mm: 0.0001
  minimum_triangle_area_mm2: 0.0000000001
  boolean_cleanup_tolerance_mm: 0.00001
visualization:
  window_size: [1500, 1100]
  arrow_length_mm: 6.0
  chinese_font: /mnt/c/Windows/Fonts/msyh.ttc
  title_font_size: 34
  legend_font_size: 23
vmtk:
  probe_python: /mnt/d/anaconda3/envs/vmtk-env/python.exe
  timeout_seconds: 30

# Required limits for the O3 correction. Current preflight stops if native ramp is absent.
o3_smoothing:
  handoff_overlap_mm: 0.8
  local_fix_radius_mm: 5.0
  minimum_clearance_mm: 1.6
  clip_diameter_factors: [0.5, 1.0, 1.5]
  extension_ratios: [4, 6, 8]
  transition_ratios: [0.25, 0.50, 0.75]
  preserve_shape_modes: [false, true]
  interpolation_mode: ramp
  slicer_executable: /mnt/d/3D Slicer 5.10.0/Slicer.exe

# Uniform all-port seam audit. A narrow seam band excludes longitudinal faceting.
surface_continuity:
  local_radius_mm: 4.0
  seam_half_width_mm: 1.0
  radial_radius_fraction: 1.7
  circumferential_plane_half_width_mm: 0.75
  circumferential_min_alignment: 0.7071067811865476
  cross_section_step_mm: 0.1
all_port_alignment:
  enabled: true
  baseline_directory: print_fixture_design_aligned
  output_directory: print_fixture_design_all_ports_aligned
