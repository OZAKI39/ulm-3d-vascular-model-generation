schema_version: 1
input:
  alignment_root: outputs/topbrain_brava_transfer/nn_production/BG001/RMCA/compact_manufacturing_roi/print_fixture_design_all_ports_aligned
  summary: all_port_attachment_summary.json
  report: all_port_attachment_report.md
  old_box_qc: ../print_fixture_design_aligned/geometry_qc.json
output:
  directory: print_frame_design
  basename: BG001_RMCA_BALANCED
pdms_keep_zone:
  basis: frozen_central_vascular_bbox_excluding_artificial_ports
  authorization: 用户已确认中央血管范围加 8 mm；生产几何仍为完整已验收 STL。
  margin_x_mm: 8.0
  margin_y_mm: 8.0
  margin_z_mm: 8.0
  maximum_frame_intrusion_mm3: 0.000001
frame:
  rail_width_mm: 4.0
  rail_depth_mm: 4.0
  corner_post_width_mm: 4.0
  vessel_clearance_mm: 6.0
  support_access_clearance_mm: 12.0
  outer_margin_mm: 10.0
  anchor_width_mm: 4.0
  minimum_connection_volume_mm3: 0.01
  minimum_connection_length_mm: 1.0
  minimum_open_face_fraction: 0.70
  minimum_opening_dimension_mm: 12.0
support_removal_probe:
  diameter_mm: 4.0
  surface_standoff_mm: 0.25
  capsule_sections: 16
support_access:
  region_length_mm: 8.0
  free_space_grid_mm: 2.0
  entry_offsets_mm: [0.0, -12.0, 12.0]
  minimum_accessible_fraction: 1.0
  maximum_display_paths: 6
orientation:
  yaw_angles_deg: [0, 45, 90, 135]
  tilt_degrees: [-5, 5]
  overhang_angle_deg: 45.0
  bed_exemption_mm: 0.20
  minimum_bed_contact_area_mm2: 20.0
  bed_contact_band_mm: 0.20
  minimum_support_polygon_margin_mm: 1.0
  bed_margin_mm: 10.0
  top_margin_mm: 5.0
  top_count: 5
printer:
  require_active_profile: true
  filament: ABS
  # Prior engineering envelope used only if the actual profile cannot be read.
  provisional_build_volume_mm: [256.0, 256.0, 250.0]
bambu:
  help_timeout_seconds: 20
  timeout_seconds: 300
  bed_type: Textured PEI Plate
  support_on_overhang_area_mm2: 1.0
  support_geometry_policy: inspect_actual_archive_then_geometry_proxy
geometry:
  mesh_tolerance_mm: 0.02
  mesh_angular_tolerance_rad: 0.10
  volume_tolerance_mm3: 0.001
  coordinate_tolerance_mm: 0.0001
  minimum_triangle_area_mm2: 0.0000000001
  boolean_cleanup_tolerance_mm: 0.00001
visualization:
  chinese_font: /mnt/c/Windows/Fonts/msyh.ttc
  window_size: [1500, 1100]
