schema_version: 1
stage: SUPPORT_AWARE_60X50_MANUFACTURING_ROI
evaluation_printer: Bambu Lab X1 Carbon 0.2 nozzle
baseline_config: config/abs_casting_mold_BG001_2mm_X1C_02.yaml
source_rmca_root: outputs/topbrain_brava_transfer/nn_production/BG001/RMCA
printer:
  required_model: Bambu Lab X1 Carbon
  required_nozzle_mm: 0.2
target:
  long_mm: 60
  short_mm: 50
  tolerance_mm: 3
  scale_factor: 1.0
  minimum_candidates: 20
  vascularmd_top_count: 8
  full_mold_top_count: 3
  three_outlet_maximum_support_cost_ratio: 1.25
box:
  margin_x_mm: 12.0
  margin_y_mm: 12.0
  margin_bottom_mm: 10.0
  margin_top_mm: 12.0
  wall_thickness_mm: 3.0
  bottom_thickness_mm: 3.0
  adaptive_unconnected_faces: true
  unconnected_face_gap_mm: 5.0
  top_headroom_mm: 5.0
clearance_levels_mm: [3.0, 2.5, 2.0, 1.6]
ports:
  outside_stub_mm: 6.0
  preferred_maximum_extension_mm: 35.0
  layout_policy: SHORTEST_FEASIBLE_SIDEWALL_WITH_MODERATE_MAXIMUM_LENGTH
notes:
  - Frozen manufacturing radius floor remains 0.60 mm regardless of the 0.2 mm nozzle.
  - All dimensions use the single saved legacy casting transform.
  - Baseline and every new mold use the same archived local slicer profiles.
  - Local slicing only; no printer upload, send or start action.
