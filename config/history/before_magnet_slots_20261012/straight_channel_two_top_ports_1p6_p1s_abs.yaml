output: outputs/straight_channel/D1p6_PDMSmin9_ABS_two_top_ports_raised3mm_3dm_P1S04
chamber_mode: closed_wall_two_vertical_ports
channel_topology: two_vertical_ports
# No OUTLET2: smooth upward bend ends at the existing OUTLET1 axis.
minimum_pdms_height_mm: 9.0
minimum_pdms_width_mm: 9.0
# Minimum values above describe finished PDMS, not nominal CAD dimensions.
# 2% is an uncalibrated conservative ABS budget, not a measured P1S rate.
abs_dimensional_allowance:
  material: ABS
  calibration_status: UNCALIBRATED_DESIGN_BUDGET
  width_shrink_fraction: 0.02
  height_shrink_fraction: 0.02
  width_error_reserve_mm: 0.30
  height_error_reserve_mm: 0.30
  cad_round_up_mm: 0.20
diameter_mm: 1.6
parent_length_mm: 14.0
downstream_length_mm: 12.0
pdms_floor_mm: 1.5
wall_mm: 2.0
base_mm: 0.0  # No internal ABS floor; external substrate defines Z0.
side_clearance_mm: 3.0
bend_radius_to_lumen_radius: 3.0
terminal_straight_mm: 0.6
pdms_above_elbow_mm: 1.5
freeboard_mm: 0.8  # Arms have no downward feet; keep PDMS CAD height 9.6 mm.
retainer_above_rim_mm: 3.0  # Clear air gap under the arm crossing the box rim.
retainer_thickness_mm: 2.0
retainer_fit_clearance_mm: 0.25
collar_radial_width_mm: 1.2
collar_thickness_mm: 1.0
port_above_retainer_mm: 3.0
cad_tolerance_mm: 0.002
cad_angular_tolerance: 0.06
printer:
  machine: Bambu Lab P1S 0.4 nozzle
  process: 0.20mm Standard @BBL X1C
  filament: Bambu ABS Vessel
  layer_height_mm: 0.2
  support_top_gap_mm: 0.2
  support_xy_gap_mm: 0.35
  support_type: normal(auto)
  support_style: snug
  raft_layers_core_only: 2
fixture_mode: bottomless_external_dovetail
dovetail:
  external_foot_mm: 2.0
  fit_clearance_mm: 0.20
  collar_capture_clearance_mm: 0.20
  upper_fork_mm: 1.20

# Heights measured in casting assembly from the external substrate top (Z0).
height_limits:
  fixture_max_mm: 15.0
  cad_reserve_mm: 0.20  # Keep frame/keys below 15; raised retainers have a separate limit.
  retainer_max_mm: 20.0  # User now permits supports above 15 mm.
  core_max_mm: 20.0
rhino_export: true
rhino_export_tag: two_top_ports_raised3mm
