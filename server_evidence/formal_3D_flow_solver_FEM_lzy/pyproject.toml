[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-fem3d"
version = "0.0.1"
description = "SI 3D Stokes FEM with global inlet flux constraint, canonical verification and mesh provenance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["numpy", "scipy", "matplotlib", "pyyaml", "vtk", "pyvista", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["remote: DOLFINx/MPI compute environment smoke test"]
