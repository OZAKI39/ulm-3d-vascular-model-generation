name: formal-fem3d-stage00
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - fenics-dolfinx=0.11.0
  - petsc=*=real*
  - petsc4py
  - mpi4py
  - mpich
  - libblas=*=*openblas
  - numpy
  - scipy
  - python-gmsh
  - pytest
  - pip
# Geometry rendering stays on WSL. PyVista is probed, but not needed for the CPU smoke.
# Exact resolved packages and URLs are saved by setup_environment.sh after installation.
