description: Frozen-flow vascular microbubble transport with bubble-bubble hydrodynamics
  and geometric hard-wall exclusion. Preflight; runtime not yet implemented.
paths:
  frozen_flow: fields/FROZEN_FLOW_FIELD_V0.h5
  wall_surface: geometry/WALL_ONLY.stl
  closed_reference: geometry/CLOSED_REFERENCE.stl
  inlet_surface: geometry/INLET.vtp
  outlet_surfaces:
  - geometry/OUTLET_0.vtp
  - geometry/OUTLET_1.vtp
  - geometry/OUTLET_2.vtp
bubbles:
  counts:
  - 1
  - 8
  - 16
  random_seed: 42
  sonovue_distribution: inputs/FROZEN_SONOVUE_HISTOGRAM.csv
  input_quantity: diameter_um; convert to radius_m by diameter*0.5e-6
  resample_sizes: false
injection:
  mode: BATCH_AT_T0_SINGLE_PLANE
  continuous_injection: false
  position_sampling: uniform by inlet cap triangle area, translated inward, followed
    by exact finite-radius and fluid rejection
  offset_rule: max(4*flow_dx_m, maximum_radius_in_case_m + initial_clearance_m)
  initial_clearance_rule: one frozen-flow voxel, flow_dx_m
  maximum_position_attempts_per_bubble: 5000
simulation:
  maximum_time_s: 0.02
  maximum_steps: 200000
  dt_max_s: 5.791749420578671e-05
  C_adv: 0.25
  C_gap: 0.4
  minimum_dt_s: 1.0e-12
  maximum_retry_count: 20
  integrator: inherit stable rigid RK2, only after initialization preflight passes
near_wall:
  thresholds:
  - 1.0
  - 0.5
  - 0.2
  - 0.1
  event_type: GEOMETRIC_ONLY
  biological_region_code: 0
output:
  trajectory_stride_steps: 1
  visualization_stride_steps: 1
physics:
  R_bulk: true
  R_bubble_bubble_excess: true
  R_wall: false
  ambient_wall_shear: false
  adhesion: false
  RBC: false
  buoyancy: false
  lift: false
  particle_inertia: false
  TWIST: PENDING
FLOW_PHYSICS_STATUS: ENGINEERING_TRANSIENT_FIELD_ONLY
