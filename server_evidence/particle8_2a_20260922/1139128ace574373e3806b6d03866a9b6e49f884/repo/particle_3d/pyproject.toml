[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-3d-frozen-sampler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "vtk>=9.3", "pyvista>=0.43"]

[project.optional-dependencies]
validation = ["pytest>=8", "matplotlib>=3.8", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/particle0"]
